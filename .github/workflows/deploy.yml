name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
  # 每天定时重建一次，刷新 Mastodon 动态页（UTC 04:00 ≈ 北京时间 12:00）
  schedule:
    - cron: '0 4 * * *'
  # 允许在 Actions 页面手动触发（发完重要嘟文想立刻刷新时用）
  workflow_dispatch:

# 限制只触发一次（push/PR/cron 同时存在时避免重复）
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload Build Artifact
        # PR 只验证构建，不上传、不部署；
        # push 到 main 与定时任务都需要上传
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # 仅 push 到 main 或定时任务才部署（PR 不部署）
    if: github.event_name != 'pull_request'
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
