<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">凭岚 Pinglan Logo v3</title>
  <desc id="desc">Ink-wash mountains on parchment background with a single ink-blue mist accent</desc>

  <!-- 暖羊皮纸背景 -->
  <rect width="512" height="512" rx="100" fill="#f5f4ed" />

  <!-- 后山：墨色（无彩色，仅明度分层） -->
  <path d="M 132 408 L 300 112 L 468 408 Z" fill="#2f2c28" stroke="#2f2c28" stroke-width="24" stroke-linejoin="round" />

  <!-- 前山：淡墨灰 -->
  <path d="M 60 408 L 192 188 L 328 408 Z" fill="#8c8779" stroke="#8c8779" stroke-width="24" stroke-linejoin="round" />

  <!-- 上层风雾 镂空遮罩 -->
  <path d="M 115 220 Q 200 140 300 220 T 465 220" fill="none" stroke="#f5f4ed" stroke-width="26" stroke-linecap="round" />
  <!-- 上层风雾 -->
  <path d="M 115 220 Q 200 140 300 220 T 465 220" fill="none" stroke="#1B365D" stroke-width="12" stroke-linecap="round" />

  <!-- 下层风雾 镂空遮罩 -->
  <path d="M 60 320 Q 150 240 260 320 T 460 320" fill="none" stroke="#f5f4ed" stroke-width="34" stroke-linecap="round" />
  <!-- 下层风雾 -->
  <path d="M 60 320 Q 150 240 260 320 T 460 320" fill="none" stroke="#1B365D" stroke-width="16" stroke-linecap="round" />

</svg>